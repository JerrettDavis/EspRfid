[platformio]
default_envs = esp32-c6-supermini

[env:esp32-c6-supermini]
platform = espressif32@7.0.1
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 115200
upload_port = COM24
board_upload.flash_size = 4MB

; MakerGO ESP32-C6 Super Mini + MFRC522/RC522 + buzzer
; RC522: CS=GPIO4, MOSI=GPIO5, MISO=GPIO6, SCK=GPIO7, RST=GPIO3, IRQ=GPIO8
; Buzzer: GPIO2

build_flags =
    -D RFID_CS_PIN=4
    -D RFID_MOSI_PIN=5
    -D RFID_MISO_PIN=6
    -D RFID_SCK_PIN=7
    -D RFID_RST_PIN=3
    -D RFID_IRQ_PIN=8
    -D BUZZER_PIN=2
